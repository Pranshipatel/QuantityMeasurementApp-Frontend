<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login / Signup</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body >

 <div class="main">
   <!-- AUTH CARD -->
    <div class="sidepanel">
      
    </div>
  <div class="card" id="auth-card">
    <div class="tabs">
      <button class="tab active" id="tab-login"  onclick="switchTab('login')">Login</button>
      <button class="tab"        id="tab-signup" onclick="switchTab('signup')">Signup</button>
    </div>

    <div class="panels">

      <!-- LOGIN PANEL -->
      <div class="panel active" id="panel-login">
        <div class="field">
          <label>Email Id</label>
          <input type="email" id="login-email" placeholder="you@example.com"/>
        </div>
        <div class="field">
          <label>Password</label>
          <div class="pw-wrap">
            <input type="password" id="login-password" placeholder="••••••••"/>
            <button class="eye-btn" onclick="togglePw('login-password', this)" tabindex="-1">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94
                  M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19
                  M1 1l22 22"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="forgot"><a href="#">Forgot password?</a></div>
        <button class="btn" onclick="doLogin()">Login</button>
      </div>

      <!-- SIGNUP PANEL -->
      <div class="panel" id="panel-signup">
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="signup-name" placeholder="name"/>
        </div>
        <div class="field">
          <label>Email Id</label>
          <input type="email" id="signup-email" placeholder="email"/>
        </div>
        <div class="field">
          <label>Password</label>
          <div class="pw-wrap">
            <input type="password" id="signup-password" placeholder="••••••••"/>
            <button class="eye-btn" onclick="togglePw('signup-password', this)" tabindex="-1">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94
                  M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19
                  M1 1l22 22"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label>Mobile Number</label>
          <input type="tel" id="signup-mobile" placeholder="+91 00000 00000"/>
        </div>
        <button class="btn" onclick="doSignup()">Signup</button>
      </div>

    </div>
  </div>
 </div>

  <!-- HOME PAGE -->
  <div id="home">
    <div class="home-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    </div>
    <h1>Welcome back, <span id="welcome-name"></span>!</h1>
    <p>You have successfully logged in. This is your home page.</p>
    <button class="logout-btn" onclick="doLogout()">Logout</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
